spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ews
    username: ews
    password: ews
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      group-id: ews-feature-processor-persistence-test
    streams:
      application-id: ews-feature-processor-test
