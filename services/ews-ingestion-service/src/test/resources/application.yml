spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ews
    username: ews
    password: ews
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:19999

ews:
  outbox:
    # Large interval so the real @Scheduled publisher doesn't race with test assertions; this test
    # only exercises the adapter's DB write, not Kafka publication (see OutboxPublisherWorkerTest in
    # ews-platform-outbox-starter for that coverage).
    publish-interval-ms: 3600000
