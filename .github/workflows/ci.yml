name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Satisfies docs/architecture/05-coherence-review-parts-i-iii.md Section 5, backlog item 1:
  # "Add CI that parses every JSON/Avro schema and enforces contract lifecycle/compatibility."
  # Runs first and fast (no Java/Maven build required) so a malformed contract fails quickly.
  validate-schemas:
    name: Validate Avro and JSON Schema contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validation libraries
        run: pip install fastavro jsonschema

      - name: Parse every Avro contract under schemas/events
        run: |
          python - <<'PY'
          import glob
          import sys
          from fastavro.schema import load_schema

          files = sorted(glob.glob("schemas/events/**/*.avsc", recursive=True))
          if not files:
              print("No .avsc files found under schemas/events", file=sys.stderr)
              sys.exit(1)

          failed = False
          for f in files:
              try:
                  load_schema(f)
                  print(f"OK   {f}")
              except Exception as e:
                  print(f"FAIL {f}: {e}", file=sys.stderr)
                  failed = True

          sys.exit(1 if failed else 0)
          PY

      - name: Parse every JSON Schema contract under schemas/
        run: |
          python - <<'PY'
          import glob
          import json
          import sys
          from jsonschema import Draft202012Validator

          files = sorted(glob.glob("schemas/**/*.schema.json", recursive=True))
          if not files:
              print("No .schema.json files found under schemas/", file=sys.stderr)
              sys.exit(1)

          failed = False
          for f in files:
              try:
                  with open(f) as fh:
                      doc = json.load(fh)
                  Draft202012Validator.check_schema(doc)
                  print(f"OK   {f}")
              except Exception as e:
                  print(f"FAIL {f}: {e}", file=sys.stderr)
                  failed = True

          sys.exit(1 if failed else 0)
          PY

  # Maven build: proves Avro code-gen (ews-schemas), JSON Schema POJO-gen, and every service-shell
  # module actually compile. Also runs ews-event-contracts-test (a second, JVM-native schema check
  # via the Avro Maven plugin's own parser) and ews-persistence-core's Postgres-backed integration
  # tests (schemas/architecture/07-build-log.md, 2026-09-24 payment-return slice entry) against the
  # postgres service below, which mirrors docker-compose.yml's postgres service (db: ews, user/pass:
  # ews/ews) and has db/migration/V1__init_phase1_baseline.sql applied before the build runs.
  build:
    name: Maven build
    runs-on: ubuntu-latest
    needs: validate-schemas
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ews
          POSTGRES_USER: ews
          POSTGRES_PASSWORD: ews
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply database migration
        env:
          PGPASSWORD: ews
        run: psql -h localhost -U ews -d ews -f db/migration/V1__init_phase1_baseline.sql

      - name: Build with Maven
        run: mvn -B -ntp verify

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: ews-financial-intelligence-jars
          path: "**/target/*.jar"
          if-no-files-found: warn
